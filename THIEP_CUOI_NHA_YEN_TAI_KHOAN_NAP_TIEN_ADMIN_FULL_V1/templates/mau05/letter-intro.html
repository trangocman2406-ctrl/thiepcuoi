<div class="m05-letter-intro" data-letter-intro>
  <canvas class="m05-letter-petals" data-letter-petals aria-hidden="true"></canvas>

  <div class="ny-intro-stage">
  <div class="m05-letter-card">
    <div class="m05-letter-badge">
      <svg class="m05-letter-envelope" viewBox="0 0 100 74" aria-hidden="true" focusable="false">
        <rect class="m05-env-panel" x="3" y="6" width="94" height="64" rx="6"/>
        <path class="m05-env-fold" d="M3 66 L38 38 M97 66 L62 38"/>
        <path class="m05-env-flap" d="M3 12 L50 46 L97 12 L97 12 Q97 6 91 6 L9 6 Q3 6 3 12 Z"/>
        <circle class="m05-env-seal" cx="50" cy="38" r="8"/>
      </svg>
    </div>

    <div class="m05-letter-card-inner">
      <span class="m05-bloom-cluster bloom-tl" aria-hidden="true">
        <span class="m05-letter-bloom bloom-1">🌿</span>
        <span class="m05-letter-bloom bloom-2">🍃</span>
        <span class="m05-letter-bloom bloom-3">🌸</span>
        <span class="m05-letter-bloom bloom-4">🌱</span>
        <span class="m05-letter-bloom bloom-5">🌾</span>
        <span class="m05-letter-bloom bloom-6">☘️</span>
        <span class="m05-letter-bloom bloom-7">🍀</span>
        <span class="m05-letter-bloom bloom-8">🌼</span>
      </span>
      <span class="m05-bloom-cluster bloom-br" aria-hidden="true">
        <span class="m05-letter-bloom bloom-1">🌿</span>
        <span class="m05-letter-bloom bloom-2">🍃</span>
        <span class="m05-letter-bloom bloom-3">🌸</span>
        <span class="m05-letter-bloom bloom-4">🌱</span>
        <span class="m05-letter-bloom bloom-5">🌾</span>
        <span class="m05-letter-bloom bloom-6">☘️</span>
        <span class="m05-letter-bloom bloom-7">🍀</span>
        <span class="m05-letter-bloom bloom-8">🌼</span>
      </span>

      <div class="m05-letter-body">
        <div class="m05-letter-names"><span data-pos-key="intro_groom_name">{{groomName}}</span> <span data-pos-key="couple_ampersand">&amp;</span> <span data-pos-key="intro_bride_name">{{brideName}}</span></div>
        <div class="m05-letter-rule" aria-hidden="true"><span>♥</span></div>
        <div class="m05-letter-date" data-pos-key="intro_date_text">Ngày {{dateDay}} tháng {{dateMonth}} năm {{dateYear}}</div>
        <div class="m05-letter-invite">{{inviteLabel}}</div>

        <button class="m05-letter-btn" type="button" data-letter-open>
          <span>{{letterOpenText}}</span>
        </button>
      </div>
    </div>
  </div>
  </div>
</div>
