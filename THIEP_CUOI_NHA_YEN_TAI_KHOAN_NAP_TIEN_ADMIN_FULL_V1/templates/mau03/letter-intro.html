<div class="ny-intro-stage">

<span aria-hidden="true" class="mau03-bloom-cluster bloom-tl">
<span class="mau03-letter-bloom bloom-1">💐</span>
<span class="mau03-letter-bloom bloom-2">🌸</span>
<span class="mau03-letter-bloom bloom-3">🌺</span>

<span class="mau03-letter-bloom bloom-5">🌼</span>

<span aria-hidden="true" class="mau03-bloom-cluster bloom-br">

<span class="mau03-letter-bloom bloom-2">🌸</span>
<span class="mau03-letter-bloom bloom-3">🌺</span>

<div class="mau03-letter-body">
<p class="mau03-letter-eyebrow" data-delay="50" data-letter-reveal="">{{coverTitle}}</p>
<div class="mau03-letter-names" data-delay="150" data-letter-reveal=""><span data-pos-key="intro_groom_name">{{groomName}}</span><em data-pos-key="couple_ampersand"> &amp; </em><span data-pos-key="intro_bride_name">{{brideName}}</span></div>
<div aria-hidden="true" class="mau03-letter-rule" data-delay="280" data-letter-reveal="">
<span>♥</span>
</div>
<div class="mau03-letter-date" data-pos-key="intro_date_text" data-delay="460" data-letter-reveal="">Ngày {{dateDay}} tháng {{dateMonth}} năm {{dateYear}}</div>
<div class="mau03-letter-invite" data-delay="640" data-letter-reveal="">{{inviteLabel}}</div>
<button aria-label="Mở thiệp cưới" class="mau03-letter-btn" data-delay="820" data-letter-open="" data-letter-reveal="" type="button">
<span>{{letterOpenText}}</span>
<i aria-hidden="true">→</i>
</button>
</div>
</div>
</div>
