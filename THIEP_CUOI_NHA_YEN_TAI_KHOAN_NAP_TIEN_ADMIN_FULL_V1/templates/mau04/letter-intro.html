<div class="mau04-letter-intro" data-letter-intro>
  <div class="mau04-letter-sparkle-layer" data-letter-sparkle aria-hidden="true"></div>

  <div class="ny-intro-stage">
  <div class="mau04-letter-card">
    <div class="mau04-letter-badge">
      <svg class="mau04-letter-envelope" viewBox="0 0 100 74" aria-hidden="true" focusable="false">
        <rect class="mau04-env-panel" x="3" y="6" width="94" height="64" rx="6"/>
        <path class="mau04-env-fold" d="M3 66 L38 38 M97 66 L62 38"/>
        <path class="mau04-env-flap" d="M3 12 L50 46 L97 12 L97 12 Q97 6 91 6 L9 6 Q3 6 3 12 Z"/>
        <circle class="mau04-env-seal" cx="50" cy="38" r="8"/>
      </svg>
    </div>

    <div class="mau04-letter-card-inner">
      <span class="mau04-bloom-cluster bloom-tl" aria-hidden="true">
        <span class="mau04-letter-hy">囍</span>
      </span>
      <span class="mau04-bloom-cluster bloom-br" aria-hidden="true">
        <span class="mau04-letter-hy">囍</span>
      </span>

      <div class="mau04-letter-body">
        <p class="mau04-letter-eyebrow">{{coverTitle}}</p>
        <div class="mau04-letter-names"><span data-pos-key="intro_groom_name">{{groomName}}</span><em data-pos-key="couple_ampersand">&amp;</em><span data-pos-key="intro_bride_name">{{brideName}}</span></div>
        <div class="mau04-letter-rule" aria-hidden="true"><span>囍</span></div>
        <div class="mau04-letter-date" data-pos-key="intro_date_text">Ngày {{dateDay}} tháng {{dateMonth}} năm {{dateYear}}</div>
        <div class="mau04-letter-invite">{{inviteLabel}}</div>

        <button class="mau04-letter-btn" type="button" data-letter-open>
          <span>{{letterOpenText}}</span>
          <i aria-hidden="true">→</i>
        </button>
      </div>
    </div>
  </div>
  </div>
</div>
