<div class="mau02-letter-intro" data-letter-intro>
  <div class="ny-intro-stage">
  <div class="mau02-letter-card">
    <div class="mau02-letter-badge">
      <svg class="mau02-letter-envelope" viewBox="0 0 100 74" aria-hidden="true" focusable="false">
        <rect class="mau02-env-panel" x="3" y="6" width="94" height="64" rx="6"/>
        <path class="mau02-env-fold" d="M3 66 L38 38 M97 66 L62 38"/>
        <path class="mau02-env-flap" d="M3 12 L50 46 L97 12 L97 12 Q97 6 91 6 L9 6 Q3 6 3 12 Z"/>
        <circle class="mau02-env-seal" cx="50" cy="38" r="8"/>
      </svg>
    </div>

    <div class="mau02-letter-card-inner">
      <span class="mau02-spark-cluster cluster-tl" aria-hidden="true">
        <span class="mau02-letter-spark spark-1">✦</span>
        <span class="mau02-letter-spark spark-2">✧</span>
        <span class="mau02-letter-spark spark-3">▲</span>
        <span class="mau02-letter-spark spark-4">•</span>
        <span class="mau02-letter-spark spark-5">·</span>
      </span>
      <span class="mau02-spark-cluster cluster-br" aria-hidden="true">
        <span class="mau02-letter-spark spark-1">✦</span>
        <span class="mau02-letter-spark spark-2">✧</span>
        <span class="mau02-letter-spark spark-3">▲</span>
        <span class="mau02-letter-spark spark-4">•</span>
        <span class="mau02-letter-spark spark-5">·</span>
      </span>

      <div class="mau02-letter-frame">
        <div class="mau02-letter-body">
          <div class="mau02-letter-names"><span data-pos-key="intro_groom_name">{{groomName}}</span> <span data-pos-key="couple_ampersand">&amp;</span> <span data-pos-key="intro_bride_name">{{brideName}}</span></div>
          <div class="mau02-letter-rule" aria-hidden="true"><span>✦</span></div>
          <div class="mau02-letter-date" data-pos-key="intro_date_text">Ngày {{dateDay}} tháng {{dateMonth}} năm {{dateYear}}</div>
          <div class="mau02-letter-invite">{{inviteLabel}}</div>

          <button class="mau02-letter-btn" type="button" data-letter-open>
            <span>{{letterOpenText}}</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  </div>
</div>
